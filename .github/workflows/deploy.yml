name: Deploy Node.js Microservices

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Deploy to server
      uses: appleboy/ssh-action@v0.1.3
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        passphrase: ${{ secrets.SSH_PASSPHRASE }}
        script: |
          echo "=== Starting Node.js Microservices Deployment ==="
          
          # Source nvm or set PATH to include node/npm
          export NVM_DIR="$HOME/.nvm"
          [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
          export PATH=$PATH:/usr/bin:/usr/local/bin
          
          cd /var/www/nodejs.espays.org
          git remote set-url origin git@github.com:Equib-Hub/espays-nodejs-microservice.git
          
          echo "=== Pulling Latest Code ==="
          git checkout main
          git pull origin main
          
          echo "=== Installing Dependencies ==="
          npm install --production --legacy-peer-deps
          
          echo "=== Setting up PM2 ==="
          if [ ! -f ecosystem.config.js ]; then
            cat > ecosystem.config.js << 'EOF'
          module.exports = {
            apps: [{
              name: 'espays-microservices',
              script: 'src/app.js',
              instances: 'max',
              exec_mode: 'cluster',
              env: {
                NODE_ENV: 'production',
                PORT: 3000
              }
            }]
          };
          EOF
          fi
          
          # Restart the application
          pm2 delete espays-microservices 2>/dev/null || true
          pm2 start ecosystem.config.js
          pm2 save
          
          echo "=== Setting Permissions ==="
          sudo chown -R $USER:$USER /var/www/nodejs.espays.org
          
          echo "=== Node.js Deployment Complete ==="
          echo "=== PM2 Status ==="
          pm2 list