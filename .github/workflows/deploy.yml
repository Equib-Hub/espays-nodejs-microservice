name: Deploy Node.js Microservices

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Deploy to server
      uses: appleboy/ssh-action@v0.1.3
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        passphrase: ${{ secrets.SSH_PASSPHRASE }}
        script: |
          echo "=== Starting Node.js Microservices Deployment ==="
          
          # Source nvm or set PATH to include node/npm
          export NVM_DIR="$HOME/.nvm"
          [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
          export PATH=$PATH:/usr/bin:/usr/local/bin
          
          cd /var/www/nodejs.espays.org
          
          echo "=== Git Status Before Pull ==="
          git status
          git log -1 --oneline
          
          echo "=== Resetting Any Local Changes ==="
          git fetch origin
          git reset --hard origin/main
          git clean -fd
          
          echo "=== Pulling Latest Code ==="
          git pull origin main
          
          echo "=== Git Status After Pull ==="
          git log -1 --oneline
          git status
          
          echo "=== Setting up Environment Variables ==="
          # Copy .env.prod as base template
          cp .env.prod .env
          
          # Append production secrets from GitHub Actions
          cat >> .env << 'ENVEOF'
          
          DB_HOST=${{ vars.DB_HOST }}
          DB_PORT=${{ vars.DB_PORT }}
          DB_DATABASE=${{ secrets.DB_DATABASE }}
          DB_USER=${{ secrets.DB_USER }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          ENCRYPTION_SALT=${{ secrets.ENCRYPTION_SALT }}
          STARTING_BLOCK=${{ vars.STARTING_BLOCK }}
          TORONET_RPC=${{ vars.TORONET_RPC }}
          WATCHED_ADDRESS=${{ vars.WATCHED_ADDRESS }}
          SCAN_BATCH_SIZE=${{ vars.SCAN_BATCH_SIZE }}
          POLLING_INTERVAL=${{ vars.POLLING_INTERVAL }}
          WEBHOOK_URL=${{ vars.WEBHOOK_URL }}
          BLOCKCHAIN_MONITOR_TEST=${{ vars.BLOCKCHAIN_MONITOR_TEST }}
          DEFAULT_ASSET_ID=${{ vars.DEFAULT_ASSET_ID }}
          ENVEOF
          
          echo "=== Environment file created ==="
          
          echo "=== Installing Dependencies ==="
          npm ci --production --legacy-peer-deps || npm install --production --legacy-peer-deps
          
          echo "=== Verifying required files exist ==="
          if [ ! -f "src/app.js" ]; then
            echo "ERROR: src/app.js not found!"
            exit 1
          fi
          
          if [ ! -f "src/blockmonitor.js" ]; then
            echo "ERROR: src/blockmonitor.js not found!"
            exit 1
          fi
          
          echo "=== Setting up PM2 ecosystem config for both API and Monitor ==="
          cat > ecosystem.config.js << 'EOF'
          module.exports = {
            apps: [
              {
                name: 'espays-api',
                script: 'src/app.js',
                instances: 2,
                exec_mode: 'cluster',
                env: {
                  NODE_ENV: 'production',
                  PORT: 3000
                },
                error_file: 'logs/api-error.log',
                out_file: 'logs/api-out.log',
                log_date_format: 'YYYY-MM-DD HH:mm:ss Z',
                merge_logs: true,
                autorestart: true,
                max_restarts: 10,
                min_uptime: '10s'
              },
              {
                name: 'espays-blockmonitor',
                script: 'src/blockmonitor.js',
                instances: 1,
                exec_mode: 'fork',
                env: {
                  NODE_ENV: 'production'
                },
                error_file: 'logs/monitor-error.log',
                out_file: 'logs/monitor-out.log',
                log_date_format: 'YYYY-MM-DD HH:mm:ss Z',
                autorestart: true,
                max_restarts: 10,
                min_uptime: '10s',
                restart_delay: 5000
              }
            ]
          };
          EOF
          
          echo "=== Creating logs directory ==="
          mkdir -p logs
          
          echo "=== Stopping existing PM2 processes ==="
          pm2 delete espays-api 2>/dev/null || true
          pm2 delete espays-blockmonitor 2>/dev/null || true
          pm2 delete espays-microservices 2>/dev/null || true
          
          echo "=== Starting both API and BlockMonitor with PM2 ==="
          pm2 start ecosystem.config.js
          pm2 save
          
          echo "=== Setting Permissions ==="
          sudo chown -R $USER:$USER /var/www/nodejs.espays.org
          
          echo "=== Node.js Deployment Complete ==="
          echo "Build timestamp: $(date)"
          echo ""
          echo "=== PM2 Status ==="
          pm2 list
          echo ""
          echo "=== Recent API Logs ==="
          pm2 logs espays-api --lines 10 --nostream
          echo ""
          echo "=== Recent BlockMonitor Logs ==="
          pm2 logs espays-blockmonitor --lines 10 --nostream